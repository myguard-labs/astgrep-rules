version: 1
id: py-bare-except
language: python
category: correctness
severity: warning
message: >-
  Bare `except:` catches BaseException subclasses such as KeyboardInterrupt and
  SystemExit, so a shutdown signal can be treated as a routine error (OWASP
  A10:2025, CWE-396). Catch `Exception` when you mean ordinary failures, or name
  the specific errors you can handle.
note: >-
  Fires on a clause with no exception type. A bare clause that re-raises with
  an unconditional direct bare `raise` is the documented cleanup idiom and
  does not match; later statements are unreachable. A clause that raises a
  different exception replaces KeyboardInterrupt or SystemExit and does match.
  PEP 760 proposed removing this form from the language.
utils:
  terminal-bare-reraise:
    regex: '^raise$'
rule:
  all:
    - kind: except_clause
    - not:
        has:
          field: value
          regex: '.'
    - not:
        has:
          kind: block
          has:
            matches: terminal-bare-reraise
cases:
  valid:
    - |
      # try:
      #     f()
      # except:
      #     pass
    - |
      text = """try:
          f()
      except:
          pass
      """
    - |
      try:
          f()
      except Exception:
          log.exception("failed")
    - |
      try:
          f()
      except:
          raise
    - |
      try:
          f()
      except:
          cleanup()
          raise
    - |
      try:
          f()
      except ValueError:
          pass
    - |
      try:
          f()
      except:
          raise
          log.info("unreachable but nonterminal")
    - |
      try:
          f()
      except:
          raise
          # a comment must not hide a direct unconditional re-raise
          log.info("still unreachable")
  invalid:
    - |
      try:
          f()
      except:
          def later():
              raise
          pass
    - |
      try:
          f()
      except:
          raise RuntimeError("failed")
    - |
      try:
          f()
      except:
          log.info("ignored")
    - |
      try:
          f()
      except:
          pass
    - |
      try:
          f()
      except:
          if debug:
              raise
          pass
    - |
      try:
          f()
      except:
          for item in items:
              if item.bad:
                  raise
          log.info("ignored")
oracles:
  ? |
    try:
        f()
    except:
        pass
  : count: 1
    texts: ["except:\n    pass"]
    ranges: [[13, 29]]
    severity: warning
