id: powershell-native-shell-dynamic-command
language: powershell
severity: error
message: >-
  A command string that is not a constant is being handed to a native shell
  through one of its execution switches: cmd's /c or /k, or the -Command,
  -EncodedCommand or an unambiguous abbreviation of either on powershell or
  pwsh. The value passed there is not an argument the child process receives as
  data -- it is a script the child parses and executes, so every metacharacter
  it contains is live. An attacker who influences the value chooses the commands
  that run, with the caller's privileges and in a process PowerShell's own
  transcription, module logging and constrained language mode do not cover
  (CWE-78, CWE-88). Quoting the interpolation does not help: cmd's own parsing
  of &, |, ^ and %VAR% happens after PowerShell has finished expanding the
  string, and PowerShell's quoting cannot reach into the child's parser. Invoke
  the target program directly and pass each value as its own argument -- through
  the call operator, Start-Process -ArgumentList, or an argument array -- so the
  value stays data and never reaches a shell parser.
note: >-
  Matches a command whose name is cmd, powershell or pwsh, with or without a
  .exe suffix, in any casing, and whose COMMAND-STRING argument is dynamic. The
  command-string argument is the element that directly follows an execution
  switch across a command_argument_sep: cmd's /c or /k, which the parser reports
  as a generic_token rather than a parameter, or -Command or -EncodedCommand on
  the PowerShell hosts, together with the abbreviations PowerShell resolves
  unambiguously (-c through -command, -enc through -encodedcommand). It is
  dynamic when it contains a variable, a subexpression, or a parenthesised
  command invocation. The test applies to that argument alone, so a variable
  bound to some other switch does not match: powershell -File $script runs a
  script file whose path is data, and powershell -ExecutionPolicy $p sets a
  policy, and neither decides an executed command string. -e is deliberately
  excluded because PowerShell does not resolve it unambiguously to
  -EncodedCommand; -ExecutionPolicy and -Encoding share the prefix. It
  deliberately does not match a constant command string -- cmd /c "dir",
  powershell -Command 'Get-Date' -- which runs fixed text, and it does not match
  direct argument passing such as cmd /c dir $path, where the variable is an
  argument to the invoked program rather than part of the parsed command string.
  The rule performs no taint tracking and does not claim the value is
  attacker-controlled; the executed text is simply not determined by the source
  under review. Where the value really is a hardcoded constant the finding still
  stands, because the correct edit is to invoke the program directly with
  separate arguments rather than to keep a second shell parser on the path.
rule:
  kind: command
  all:
    - has:
        field: command_name
        regex: '(?i)^(cmd|cmd\.exe|powershell|powershell\.exe|pwsh|pwsh\.exe)$'
    # `command_elements` is flat, so the value of a switch is not its child but
    # the sibling that follows it across a `command_argument_sep`. cmd's /c and
    # /k are not parameters at all -- the parser reports them as generic_token,
    # because a leading slash is not PowerShell parameter syntax -- so both
    # forms have to be named explicitly.
    - has:
        field: command_elements
        has:
          all:
            - follows:
                kind: command_argument_sep
                follows:
                  any:
                    - kind: generic_token
                      regex: '^/[ckCK]$'
                    # Spelled out rather than written as a nested-optional
                    # regex: the abbreviations PowerShell actually resolves
                    # without ambiguity stop at -c and -enc respectively, and an
                    # enumeration makes the boundary reviewable. -e is absent on
                    # purpose.
                    - kind: command_parameter
                      regex: '(?i)^-(c|co|com|comm|comma|comman|command|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)$'
            # As in the Add-Type rule, matching the inner kinds rather than the
            # enclosing string node is what keeps a constant command string out:
            # a non-interpolating double-quoted string and a single-quoted
            # string carry neither a variable nor a subexpression.
            - has:
                stopBy: end
                any:
                  - kind: variable
                  - kind: sub_expression
                  - kind: command
