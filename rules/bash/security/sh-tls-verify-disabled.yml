id: sh-tls-verify-disabled
language: bash
severity: error
message: >-
  TLS certificate verification disabled on a download — curl -k, wget
  --no-check-certificate or pip --trusted-host accept any certificate, so a
  machine-in-the-middle serves whatever content it likes and the result is
  usually then installed or executed (OWASP A03:2025). Fix the trust store or
  pass the private CA bundle instead: curl --cacert, pip --cert.
note: >-
  Fires on the flag itself, bound to the command that defines it: curl -k or
  --insecure (also inside a cluster of common no-argument options such as
  -sSk), wget
  --no-check-certificate and pip --trusted-host, with or without =host.
  wget -k is --convert-links and does not match. A temporary local workaround is the stated excuse;
  it should never reach a committed script, Dockerfile or CI job, which is
  exactly where this rule looks.
rule:
  kind: command
  any:
    # curl: --insecure, or a short-option cluster carrying k (lowercase; -K
    # is the config-file option).
    - all:
        - has:
            field: name
            regex: '^curl$'
        - has:
            kind: word
            # Do not treat the argument of -o/-K/-H/... as another option:
            # only cluster k with curl switches that take no argument.
            regex: '^(--insecure|-[sSLfIiNvk]*k[sSLfIiNvk]*)$'
    - all:
        - has:
            field: name
            regex: '^wget$'
        - has:
            kind: word
            regex: '^--no-check-certificate$'
    - all:
        - has:
            field: name
            regex: '^(pip|pip3)$'
        - has:
            kind: word
            regex: '^--trusted-host(=.*)?$'
