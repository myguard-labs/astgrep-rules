# Generated from: plans/cpp/security/null-library-function-cpp.yml
id: null-library-function-cpp
language: cpp
severity: warning
message: >-
  A library function that may return NULL is dereferenced or passed directly to a
  library function that requires a valid pointer, without a NULL check.
note: >-
  [CWE-476] NULL Pointer Dereference. [REFERENCES]
      - https://wiki.sei.cmu.edu/confluence/display/c/EXP34-C.+Do+not+dereference+null+pointers
ast-grep-essentials: true
utils:
  null-return-call:
    kind: call_expression
    has:
      field: function
      regex: ^(?:(?:::|std::)?(?:fgets|fopen|getenv|getgrent|getgrgid|getgrnam|getlogin|getpwent|getpwnam|getpwuid|getpwuuid|gets|inet_ntop|realpath|tempnam|tmpfile|tmpnam|memchr|strcasestr_l|strcasestr|strchr|strnstr|strpbrk|strrchr|strstr|strtok_r|strtok))$
  null-return-paren-one:
    kind: parenthesized_expression
    has:
      stopBy: neighbor
      matches: null-return-call
  null-return-paren-two:
    kind: parenthesized_expression
    has:
      stopBy: neighbor
      matches: null-return-paren-one
  null-return-operand:
    any:
    - matches: null-return-call
    - matches: null-return-paren-one
    - matches: null-return-paren-two
  null-return-assignment:
    kind: assignment_expression
    has:
      field: right
      matches: null-return-operand
  unsafe-pointer-operand:
    any:
    - matches: null-return-operand
    - matches: null-return-assignment
  first-pointer-consumer:
    regex: ^(?:(?:::|std::)?(?:atof|atoi|atol_l|atol|atoll_l|atoll|getc|fprintf|fgetpos|fseek|fseeko|fsetpos|ftell|ftello|rewind|strlen|strtoimax|strtod|strtol|strtoul|strtoll|strtoq|bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy|fwrite))$
  second-pointer-consumer:
    regex: ^(?:(?:::|std::)?(?:fprintf|bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy))$
rule:
  all:
  - not:
      inside:
        stopBy: end
        kind: ERROR
  - any:
    - kind: subscript_expression
      has:
        field: argument
        matches: null-return-operand
    - kind: field_expression
      has:
        field: argument
        matches: null-return-operand
    - kind: pointer_expression
      has:
        field: argument
        matches: null-return-operand
    - kind: call_expression
      all:
      - has:
          field: function
          matches: first-pointer-consumer
      - has:
          field: arguments
          has:
            nthChild: 1
            matches: unsafe-pointer-operand
    - kind: call_expression
      all:
      - has:
          field: function
          matches: second-pointer-consumer
      - has:
          field: arguments
          has:
            nthChild: 2
            matches: unsafe-pointer-operand
    - kind: call_expression
      all:
      - has:
          field: function
          regex: ^(?:(?:::|std::)?fwrite)$
      - has:
          field: arguments
          has:
            nthChild: 4
            matches: unsafe-pointer-operand
    - kind: call_expression
      all:
      - has:
          field: function
          regex: ^(?:(?:::|std::)?fprintf)$
      - has:
          field: arguments
          all:
          - has:
              nthChild: 2
              kind: string_literal
              regex: '%s'
          - has:
              nthChild: 3
              matches: unsafe-pointer-operand
