id: php-insecure-cookie-flags
language: php
severity: error
message: >-
  Cookie set without both httponly and secure enabled — script on the page can
  read it via document.cookie, or the browser can send it over plaintext HTTP
  where it can be captured (CWE-1004, CWE-614). For a session or auth cookie
  that is account takeover. Enable both flags and set samesite as appropriate.
note: >-
  Fires on a positional or named expires_or_options array in which either
  httponly or secure is absent or not literally true. Named options are
  recognized in any argument order. Outside the options-array form, secure and
  httponly must each be literally true, supplied either at positional arguments
  six and seven or by a named argument. Mixed positional/named calls are
  supported. A deliberately readable, non-sensitive preference cookie is the
  routine dismissal.
utils:
  positional-options-array:
    kind: argument
    nthChild: 3
    has:
      kind: array_creation_expression
  named-options-array:
    kind: argument
    all:
      - has:
          field: name
          regex: '^expires_or_options$'
      - has:
          kind: array_creation_expression
  options-array:
    any:
      - matches: positional-options-array
      - matches: named-options-array
  positional-secure-true:
    kind: argument
    nthChild: 6
    regex: '(?i)^true$'
  positional-httponly-true:
    kind: argument
    nthChild: 7
    regex: '(?i)^true$'
  named-secure-true:
    kind: argument
    all:
      - has:
          field: name
          regex: '^secure$'
      - regex: '(?i):\s*true$'
  named-httponly-true:
    kind: argument
    all:
      - has:
          field: name
          regex: '^httponly$'
      - regex: '(?i):\s*true$'
  secure-true:
    any:
      - matches: positional-secure-true
      - matches: named-secure-true
  httponly-true:
    any:
      - matches: positional-httponly-true
      - matches: named-httponly-true
  flag-true:
    kind: array_element_initializer
    regex: '(?i)^["\x27](httponly|secure)["\x27]\s*=>\s*true$'
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^(setcookie|setrawcookie)$'
    - any:
        # Options array missing httponly => true.
        - has:
            field: arguments
            has:
              matches: options-array
              not:
                has:
                  kind: array_creation_expression
                  has:
                    matches: flag-true
                    regex: '(?i)httponly'
        # Options array missing secure => true.
        - has:
            field: arguments
            has:
              matches: options-array
              not:
                has:
                  kind: array_creation_expression
                  has:
                    matches: flag-true
                    regex: '(?i)secure'
        # Non-options form missing or disabling either positional/named flag.
        - all:
            - not:
                has:
                  field: arguments
                  has:
                    matches: options-array
            - any:
                - not:
                    has:
                      field: arguments
                      has:
                        matches: secure-true
                - not:
                    has:
                      field: arguments
                      has:
                        matches: httponly-true
