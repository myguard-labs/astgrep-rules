id: php-include-stream-wrapper
language: php
severity: error
message: >-
  include/require of a stream-wrapper URL rather than a filesystem path. The
  interpreter executes whatever the wrapper yields: php://input replays the raw
  request body as code, data:// and php://memory execute an inline payload,
  expect:// runs the string as a command, and http:// or https:// fetches the
  body from a host the local process does not control (CWE-98, CWE-829).
  Include a filesystem path resolved against a fixed base directory, and
  restrict the wrappers the deployment allows with allow_url_include off.
note: >-
  Matches a literal included path whose scheme is php, data, expect, http or
  https, including the interpolated form where the scheme is still literal.
  A plain relative or absolute filesystem path does not match, and neither does
  a path stored in a variable — the variable form is the separate shipped
  php-file-inclusion-variable. phar:// and ftp:// are deliberately outside the
  shape: a build step that includes from its own phar, and a deployment that
  includes from a controlled ftp mirror, are real benign uses, so those two
  schemes would make this an advisory rule rather than the near-zero-false-positive
  claim its error severity carries. An option-name or scheme assembled from a
  variable is likewise not visible here.
rule:
  any:
    - kind: include_expression
    - kind: include_once_expression
    - kind: require_expression
    - kind: require_once_expression
  has:
    # Anchor on the literal's own first text node: a regex over the include
    # expression or the whole string would also be satisfied by a scheme
    # appearing inside a longer interpolated path.
    any:
      - kind: string
      - kind: encapsed_string
    has:
      kind: string_content
      nthChild: 1
      regex: '(?i)^(php|data|expect|https?)://'
