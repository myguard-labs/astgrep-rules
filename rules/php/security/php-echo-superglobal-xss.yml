id: php-echo-superglobal-xss
language: php
severity: error
message: >-
  Request data echoed without escaping — reflected XSS (CWE-79, rank 1 in the
  2025 CWE Top 25). The browser parses the response as HTML, so an attacker
  supplying markup runs script in the victim's session. Wrap the value in
  htmlspecialchars($v, ENT_QUOTES, "UTF-8"), or a templating layer that escapes
  by default.
note: >-
  Fires on echo/print of a superglobal, directly or interpolated. A value echoed
  into a non-HTML response (JSON with the right Content-Type) is the routine
  dismissal; escaping is still the safer default.
rule:
  any:
    - kind: echo_statement
    - kind: print_intrinsic
  has:
    stopBy: end
    kind: variable_name
    regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
  not:
    has:
      stopBy: end
      kind: function_call_expression
      has:
        field: function
        regex: '^(htmlspecialchars|htmlentities|urlencode|rawurlencode|intval|json_encode)$'
