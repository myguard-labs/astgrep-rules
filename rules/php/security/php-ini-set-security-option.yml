id: php-ini-set-security-option
language: php
severity: error
message: >-
  ini_set rewrites a php.ini option that is itself a security control. Changing
  open_basedir, include_path or disable_functions at runtime relaxes the
  filesystem and callable restrictions the deployment relies on — the published
  open_basedir escape walks the setting up to "/" with repeated ini_set and
  chdir, then reads any file on the host — and turning off assert.active or
  zend.assertions disables assertion-based checks the code still treats as
  enforced (CWE-15, CWE-693). Pin these in php.ini or the FPM pool, where the
  application cannot reach them.
note: >-
  Matches only a literal option name of open_basedir, include_path,
  disable_functions, disable_classes, assert.active or zend.assertions, given
  positionally or through the option/varname named argument. Ordinary runtime
  tuning — memory_limit, max_execution_time, error_reporting, date.timezone —
  is outside the shape, and so is an option name assembled from a variable or
  concatenation, which is the bypass this shape cannot see. ini_get, which only
  reads, does not match. A deployment that deliberately widens include_path from
  a bootstrap file still holds a runtime-writable security control, so a match is
  a site to move into configuration rather than proof of an attack.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '(?i)^\\?ini_set$'
    - has:
        field: arguments
        has:
          kind: argument
          all:
            - any:
                - all:
                    - nthChild: 1
                    - not: {has: {field: name, kind: name}}
                - has: {field: name, kind: name, regex: '^(option|varname)$'}
            # Anchor the regex to the WHOLE literal, quotes included, so an
            # interpolated suffix such as "open_basedir{$s}" cannot satisfy it.
            # A subtree match on string_content would accept any literal that
            # merely STARTS with the option name.
            - has:
                any:
                  - kind: string
                  - kind: encapsed_string
                regex: '(?i)^[''"](open_basedir|include_path|disable_functions|disable_classes|assert\.active|zend\.assertions)[''"]$'
    # Enabling the assertion options is hardening, not a weakening: the defect
    # this rule names is turning them OFF. Anchored to a literal enabling value,
    # so a dynamic or non-literal value stays reportable.
    - not:
        all:
          - has:
              field: arguments
              has:
                kind: argument
                all:
                  # Positionally, or through the option/varname named argument,
                  # mirroring the positive side of the rule.
                  - any:
                      - all:
                          - nthChild: 1
                          - not: {has: {field: name, kind: name}}
                      - has: {field: name, kind: name, regex: '^(option|varname)$'}
                  - has:
                      any:
                        - kind: string
                        - kind: encapsed_string
                      regex: '(?i)^[''"](assert\.active|zend\.assertions)[''"]$'
          - has:
              field: arguments
              has:
                kind: argument
                all:
                  - any:
                      - all:
                          - nthChild: 2
                          - not: {has: {field: name, kind: name}}
                      - has: {field: name, kind: name, regex: '^(value|newvalue)$'}
                  - has:
                      any:
                        - kind: string
                        - kind: encapsed_string
                        - kind: integer
                      regex: '(?i)^([''"]?(1|on|true)[''"]?)$'
