id: py-requests-verify-false
language: python
severity: error
message: >-
  requests call with verify=False — the server's TLS certificate is not checked,
  so a machine-in-the-middle can present any certificate and read or rewrite the
  traffic, credentials and tokens included. Drop verify=False; to trust a private
  CA pass verify="/path/to/ca-bundle.pem" instead.
note: >-
  Fires on requests.* / session.* calls with a literal verify=False. A scan of a
  host with a known-bad certificate is the only routine dismissal; it should not
  reach production code.
rule:
  kind: call
  all:
    - has:
        field: function
        regex: '(^|\.)(get|post|put|patch|delete|head|options|request)$'
    - has:
        kind: argument_list
        has:
          kind: keyword_argument
          all:
            - has: { field: name, regex: ^verify$ }
            - has: { field: value, regex: ^False$ }
