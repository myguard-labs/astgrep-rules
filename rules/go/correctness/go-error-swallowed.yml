id: go-error-swallowed
language: go
severity: warning
message: >-
  Call result discarded with the blank identifier while no error is captured —
  if the call returns an error it is lost, and the code continues with a
  zero-value result it believes is valid. Capture the error and handle it, or
  state in a comment why the failure is safe to ignore here.
note: >-
  Only fires when nothing in the assignment binds an err- or ok-named variable,
  so `_, err := f()` and the `_, ok := m[k]` comma-ok idiom do not match. Deliberate discards of a cleanup call
  (`_ = f.Close()`) are excluded by name; other intentional discards still match
  and should carry a comment.
rule:
  any:
    - kind: assignment_statement
    - kind: short_var_declaration
  all:
    - has:
        field: left
        kind: expression_list
        has:
          kind: identifier
          regex: '^_$'
    - has:
        field: right
        kind: expression_list
        has:
          kind: call_expression
    - not:
        has:
          field: left
          kind: expression_list
          has:
            kind: identifier
            regex: '(?i)^(e|err[a-z0-9_]*|ok)$'
    - not:
        has:
          field: right
          stopBy: end
          kind: field_identifier
          regex: '^(Close|Flush|Sync|Kill|Wait|Remove|RemoveAll|SetReadDeadline|SetWriteDeadline|SetDeadline)$'
