id: go-range-outside-bounds-and
language: go
severity: warning
message: A range-rejection condition combines value < lower and value > upper with
  &&, making it unreachable for an ordered valid range.
note: For an ordered inclusive range, a value outside either bound must use disjunction;
  the conjunction can never reject one-sided outliers.
rule:
  kind: if_statement
  has:
    field: condition
    regex: '^.* < .* && .* > .*$'
