id: go-test-diagnostic-observed-value
language: go
severity: warning
message: >-
  Assertion diagnostic repeats the expected value; check whether one slot should
  print the value initialized for comparison.
note: >-
  Matches a short-if that initializes one identifier, with a sole direct Fatalf
  call taking exactly two values after the format string, both repeating the
  expected condition operand, within a function declaring a parameter named t of
  type *testing.T. It does not resolve
  aliases or shadowing, interpret the format string, or follow values beyond this if.
  Different format verbs can legitimately print the same value twice.
  Other helpers and repeated observed operands require separate rules and evidence.
rule:
  all:
    - any:
        - pattern: if $GOT := $ACTUAL; $GOT != $WANT { $$$BODY }
        - pattern: if $GOT := $ACTUAL; $WANT != $GOT { $$$BODY }
    - has:
        field: consequence
        has:
          kind: statement_list
          has:
            all:
              - pattern:
                  context: 'func f() { t.Fatalf($FMT, $WANT, $WANT) }'
                  selector: expression_statement
              - nthChild:
                  position: 1
                  ofRule:
                    not:
                      kind: comment
              - nthChild:
                  position: 1
                  reverse: true
                  ofRule:
                    not:
                      kind: comment
    - pattern: $ASSERTION
    - inside:
        # Named functions and methods cannot nest in valid Go.
        stopBy:
          kind: func_literal
        has:
          field: parameters
          kind: parameter_list
          has:
            kind: parameter_declaration
            all:
              - has:
                  kind: identifier
                  regex: '^t$'
              - has:
                  field: type
                  pattern:
                    context: 'func f(t *testing.T) {}'
                    selector: pointer_type
labels:
  ASSERTION:
    style: primary
