id: go-test-diagnostic-observed-value
language: go
severity: warning
message: >-
  Assertion diagnostic prints the expected value in both observed and expected
  slots, hiding the value initialized for comparison.
note: >-
  Matches the exact short-if form with a direct Fatalf call whose first two
  diagnostic values are the same condition operand, within a function declaring
  a parameter named t of type *testing.T. It does not resolve aliases or
  shadowing, interpret the format string, or follow values beyond this if.
rule:
  all:
    - any:
        - pattern: if $GOT := $ACTUAL; $GOT != $WANT { $$$BODY }
        - pattern: if $GOT := $ACTUAL; $WANT != $GOT { $$$BODY }
    - has:
        field: consequence
        has:
          kind: statement_list
          has:
            all:
              - pattern:
                  context: 'func f() { t.Fatalf($FMT, $WANT, $WANT) }'
                  selector: expression_statement
              - nthChild:
                  position: 1
                  ofRule:
                    not:
                      kind: comment
              - nthChild:
                  position: 1
                  reverse: true
                  ofRule:
                    not:
                      kind: comment
    - pattern: $ASSERTION
    - inside:
        # Named functions and methods cannot nest in valid Go.
        stopBy:
          kind: func_literal
        has:
          field: parameters
          kind: parameter_list
          has:
            kind: parameter_declaration
            all:
              - has:
                  kind: identifier
                  regex: '^t$'
              - has:
                  field: type
                  pattern:
                    context: 'func f(t *testing.T) {}'
                    selector: pointer_type
labels:
  ASSERTION:
    style: primary
