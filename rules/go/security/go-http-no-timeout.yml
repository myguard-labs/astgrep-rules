id: go-http-no-timeout
language: go
severity: warning
message: >-
  http.Client or http.Server composite literal without a timeout field. The zero
  value means no timeout at all, so a slow or hostile peer holds the connection
  and its goroutine indefinitely until file descriptors or memory run out.
  Set Timeout on a client; set ReadHeaderTimeout/ReadTimeout and WriteTimeout on
  a server.
note: >-
  Fires on an http.Client or http.Server literal with no timeout field named,
  or with a direct timeout field set to the literal zero; the package qualifier
  is required, so an unrelated Client or Server type does not match. A client
  whose Transport carries its own timeouts, or a server wrapped by one that
  does, still needs review. Computed expressions that evaluate to zero are not
  resolved.
utils:
  timeout-field:
    kind: keyed_element
    has:
      field: key
      regex: 'Timeout$'
  zero-timeout-field:
    matches: timeout-field
    has:
      field: value
      regex: '^0$'
rule:
  kind: composite_literal
  all:
    - has:
        field: type
        regex: '^http\.(Client|Server)$'
    - has:
        field: body
        kind: literal_value
    - any:
        - not:
            has:
              field: body
              kind: literal_value
              has:
                matches: timeout-field
        - has:
            field: body
            kind: literal_value
            has:
              matches: zero-timeout-field
