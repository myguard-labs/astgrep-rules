id: go-http-no-timeout
language: go
severity: warning
message: >-
  http.Client or http.Server composite literal without a timeout field. The zero
  value means no timeout at all, so a slow or hostile peer holds the connection
  and its goroutine indefinitely until file descriptors or memory run out.
  Set Timeout on a client; set ReadHeaderTimeout/ReadTimeout and WriteTimeout on
  a server.
note: >-
  Fires on a literal with no timeout field named. A client whose Transport
  carries its own timeouts, or a server wrapped by one that does, still needs
  review; the field name is the only signal available here.
rule:
  kind: composite_literal
  all:
    - has:
        field: type
        regex: '^(http\.)?(Client|Server)$'
    - has:
        field: body
        kind: literal_value
    - not:
        has:
          stopBy: end
          kind: keyed_element
          has:
            field: key
            regex: 'Timeout$'
