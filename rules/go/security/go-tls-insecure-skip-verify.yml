id: go-tls-insecure-skip-verify
language: go
severity: error
message: >-
  InsecureSkipVerify: true in a tls.Config — the peer certificate chain and host
  name are not validated, so any machine-in-the-middle can present a self-signed
  certificate and read or rewrite the connection. Remove the field and fix the
  trust store instead; to pin a private CA, set RootCAs to a cert pool holding it.
note: >-
  Fires on a literal `true` in an InsecureSkipVerify field. A test harness
  talking to a throwaway local server is the only routine dismissal, and even
  that should not ship in a production build path.
rule:
  kind: keyed_element
  all:
    - has:
        field: key
        regex: ^InsecureSkipVerify$
    - has:
        field: value
        regex: ^true$
