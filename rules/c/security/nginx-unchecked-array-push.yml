id: nginx-unchecked-array-push
language: c
severity: warning
message: >-
  ngx_array_push result stored without a NULL check before the enclosing block
  ends. The push allocates when the array is full and returns NULL on failure,
  so writing through the result is a NULL dereference under memory pressure
  (CWE-476). Guard with `if (p == NULL) return NGX_ERROR;` — or
  NGX_HTTP_INTERNAL_SERVER_ERROR in a handler — before using it.
note: >-
  Unlike nginx-unchecked-palloc this checks for the guard rather than only
  inventorying call sites: a match means no comparison of the assigned name
  against NULL follows in the same block. Upstream nginx tracks the same
  omission in nginx/nginx#526.
rule:
  kind: expression_statement
  all:
    - has:
        kind: assignment_expression
        all:
          - has:
              field: left
              kind: identifier
              pattern: $P
          - has:
              field: right
              kind: call_expression
              has:
                field: function
                regex: '^(ngx_array_push|ngx_array_push_n|ngx_list_push)$'
    - not:
        precedes:
          stopBy: end
          has:
            stopBy: end
            kind: binary_expression
            has:
              kind: identifier
              pattern: $P
