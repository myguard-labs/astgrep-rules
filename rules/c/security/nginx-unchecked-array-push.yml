id: nginx-unchecked-array-push
language: c
severity: warning
message: >-
  ngx_array_push result stored without a NULL check as the next statement. The push allocates when the array is full and returns NULL on failure,
  so writing through the result is a NULL dereference under memory pressure
  (CWE-476). Guard with `if (p == NULL) return NGX_ERROR;` — or
  NGX_HTTP_INTERNAL_SERVER_ERROR in a handler — before using it.
note: >-
  Unlike nginx-unchecked-palloc this checks for the guard rather than only
  inventorying call sites: a match means the statement right after the push
  is not a NULL-rejecting if that exits, or a non-NULL branch that scopes the
  use. nginx style puts
  the NULL check there; a guard placed later, after other statements, is
  reported so the reader confirms nothing dereferences the name first, and
  an unrelated comparison or a NULL check that merely logs does not count as
  a guard. Upstream nginx tracks the same
  omission in nginx/nginx#526.
utils:
  push-call:
    kind: call_expression
    has:
      field: function
      regex: '^(ngx_array_push|ngx_array_push_n|ngx_list_push)$'
  guard-on-p:
    kind: if_statement
    any:
      # The dereference is scoped to a branch entered only when P is non-NULL.
      - all:
          - has:
              field: condition
              any:
                - pattern: ($P)
                - pattern: ($P != NULL)
                - pattern: (NULL != $P)
          - has:
              field: consequence
              has:
                stopBy: end
                any:
                  - pattern: $P->$F
                  - pattern: $P[$I]
          - not:
              precedes:
                stopBy: end
                has:
                  stopBy: end
                  any:
                    - pattern: $P->$F
                    - pattern: $P[$I]
      # The NULL branch exits before later code can use P.
      - all:
          - has:
              field: condition
              has:
                stopBy: end
                any:
                  - pattern: $P == NULL
                  - pattern: NULL == $P
                  - pattern: '!$P'
          - has:
              field: consequence
              any:
                - kind: return_statement
                - kind: goto_statement
                - kind: compound_statement
                  has:
                    any:
                      - kind: return_statement
                      - kind: goto_statement
rule:
  any:
    - kind: expression_statement
      all:
        - has:
            kind: assignment_expression
            all:
              - has: {field: left, kind: identifier, pattern: $P}
              - has: {field: right, matches: push-call}
        - not:
            precedes:
              matches: guard-on-p
    - kind: declaration
      all:
        - has:
            kind: init_declarator
            all:
              - has:
                  field: declarator
                  kind: pointer_declarator
                  has: {field: declarator, kind: identifier, pattern: $P}
              - has: {field: value, matches: push-call}
        - not:
            precedes:
              matches: guard-on-p
