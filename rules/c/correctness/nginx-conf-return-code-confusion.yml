id: nginx-conf-return-code-confusion
language: c
severity: warning
message: >-
  Return code from the wrong nginx family. Configuration handlers return
  char * and use NGX_CONF_OK / NGX_CONF_ERROR; ngx_int_t handlers use NGX_OK /
  NGX_ERROR. The wrong family only works by pointer/integer coincidence
  (NGX_OK is 0, NGX_ERROR is -1) and breaks any caller that compares the
  result against the other family.
note: >-
  Real: nginx-zstd-module 1b52f42, merge_loc_conf returned NGX_OK from a
  char * function. The char * side requires either an ngx_conf_t * parameter
  (a directive handler) or the ngx_cycle_t * plus void * pair of the core
  module init_conf callback (core/ngx_module.h), so an unrelated char * helper
  that merely takes a cycle is not flagged. A return nested inside an inner
  function is attributed to that function, not the enclosing handler. Only return
  statements are matched; a value stored in a local first needs the local's
  type, and u_char * / char ** functions are out of scope.
utils:
  conf-callback:
    kind: function_declarator
    any:
      - regex: \bngx_conf_t\s*\*
      - all:
          - regex: \bngx_cycle_t\s*\*
          - regex: \bvoid\s*\*
rule:
  any:
    - kind: return_statement
      regex: ^return\s+NGX_(OK|ERROR|AGAIN|DECLINED|DONE|BUSY|ABORT)\s*;$
      all:
        - inside:
            kind: function_definition
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^char$
              - has:
                  field: declarator
                  kind: pointer_declarator
                  has:
                    field: declarator
                    matches: conf-callback
        - not:
            inside:
              kind: function_definition
              stopBy: end
              not:
                has:
                  field: declarator
                  kind: pointer_declarator
                  has:
                    field: declarator
                    matches: conf-callback
    - kind: return_statement
      regex: ^return\s+NGX_CONF_(OK|ERROR)\s*;$
      all:
        - inside:
            kind: function_definition
            stopBy: end
            all:
              - has:
                  field: type
                  regex: ^(ngx_int_t|ngx_uint_t|int)$
              - has:
                  field: declarator
                  kind: function_declarator
        - not:
            inside:
              kind: function_definition
              stopBy: end
              not:
                has:
                  field: type
                  regex: ^(ngx_int_t|ngx_uint_t|int)$
