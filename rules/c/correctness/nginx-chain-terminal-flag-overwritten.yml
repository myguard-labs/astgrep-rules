id: nginx-chain-terminal-flag-overwritten
language: c
severity: warning
message: A chain loop assigns its aggregate terminal flag from each element's last_buf
  bit, allowing a later nonterminal element to erase an earlier terminal observation.
note: last_buf may precede trailing empty links, making direct assignment a reusable
  loss-of-terminal-state pattern in nginx output-chain loops.
rule:
  kind: for_statement
  has:
    stopBy: end
    kind: assignment_expression
    pattern:
      context: |
        void f(void) { $FLAG = $BUF->last_buf; }
      selector: assignment_expression
