id: nginx-empty-ngx-str-converted-to-null
language: c
severity: warning
message: A helper converting an ngx_str_t to a C string returns a NULL output pointer
  when the input length is zero rather than allocating an empty NUL-terminated string.
note: A successful conversion API should preserve the C-string invariant for empty
  nginx strings; NULL changes an empty value into an absent pointer at FFI callers.
rule:
  kind: if_statement
  all:
    - has:
        field: condition
        pattern:
          context: |
            void f(void) { if ($STR.len == 0) {} }
          selector: parenthesized_expression
    - has:
        stopBy: end
        kind: assignment_expression
        pattern:
          context: |
            void f(void) { *$OUT = NULL; }
          selector: assignment_expression
