id: nginx-pool-cleanup-add-size-discarded
language: c
severity: info
message: >-
  ngx_pool_cleanup_add() was given a size expression other than literal zero,
  so it may allocate cleanup->data, and a later statement overwrites
  cleanup->data with another pointer. Where the size is genuinely non-zero the
  allocated block is orphaned. Pass 0 when the handler receives an external
  pointer.
note: >-
  Real: nginx-zstd-module f735a5d. Advisory: ngx_pool_cleanup_add allocates
  only when the runtime size is non-zero (core/ngx_palloc.c), and this rule
  cannot evaluate the expression, so a macro or variable that happens to be
  zero still matches. The allocating statement may be a plain assignment, a
  declaration with an initialiser, or an assignment in an if condition or its
  body.
  The overwrite must follow it in source order, but no path analysis is done,
  so the two may sit on branches that never both execute. Both statements must
  be siblings in the same function body, so an allocation in one function and
  a write in another do not pair. A GNU nested function definition is not
  parsed as a nested function by tree-sitter, so an allocation written inside
  one is treated as belonging to the enclosing body; nginx does not use that
  extension.
utils:
  alloc-stmt:
    any:
      - kind: expression_statement
        has:
          pattern: $C = ngx_pool_cleanup_add($P, $N)
          kind: assignment_expression
          stopBy: end
      - kind: if_statement
        has:
          pattern: $C = ngx_pool_cleanup_add($P, $N)
          kind: assignment_expression
          stopBy: end
      - kind: declaration
        has:
          kind: init_declarator
          all:
            - has:
                field: declarator
                has:
                  kind: identifier
                  pattern: $C
                  stopBy: end
            - has:
                field: value
                pattern: ngx_pool_cleanup_add($P, $N)
rule:
  matches: alloc-stmt
  precedes:
    stopBy: end
    has:
      pattern: $C->data = $V
      stopBy: end
constraints:
  N: {not: {regex: '^0$'}}
