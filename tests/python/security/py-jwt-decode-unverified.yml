id: py-jwt-decode-unverified
valid:
- jwt.decode(token, key, algorithms=["RS256"])
- 'jwt.decode(token, key, options={"verify_signature": True})'
- jwt.decode(token, key, algorithms=["HS256"], verify=True)
- base64.decode(data)
- '# jwt.decode(token, verify=False)'
- s = 'jwt.decode(token, verify=False)'
invalid:
- jwt.decode(token, verify=False)
- 'jwt.decode(token, key, options={"verify_signature": False})'
- jwt.decode(token, key, algorithms=["HS256"], verify=False)
