id: nginx-empty-ngx-str-converted-to-null
valid:
- |-
  *out = ngx_pnalloc(pool, value.len + 1);
  (*out)[value.len] = '\0';
- |-
  void f(ngx_str_t value, char **out) {
    if (value.len == 0) {
      *out = empty_string;
      return NGX_OK;
    }
  }
- |-
  void f(void) {
    const char *text = "if (value.len == 0) { *out = NULL; }";
    /* if (value.len == 0) { *out = NULL; } */
  }
invalid:
- |-
  if (value.len == 0) {
    *out = NULL;
    return NGX_OK;
  }
- |-
  void f(ngx_str_t input, char **result) {
    if (input.len == 0) {
      *result = NULL;
      return NGX_OK;
    }
  }
