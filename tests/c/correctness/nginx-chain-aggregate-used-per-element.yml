id: nginx-chain-aggregate-used-per-element
valid:
- |-
  int seen_last = 0;
  for (cl = in; cl; cl = cl->next) {
    int is_last = cl->buf->last_buf;
    seen_last |= is_last;
    if (is_last) pass(cl);
  }
- |-
  void f(chain_t *in) {
    int seen_last = 0;
    for (cl = in; cl; cl = cl->next) {
      seen_last |= cl->buf->last_buf;
    }
    if (seen_last) flush();
  }
- |-
  void f(chain_t *in) {
    const char *text = "seen_last |= cl->buf->last_buf; if (seen_last)";
    /* seen_last |= cl->buf->last_buf; if (seen_last) pass(cl); */
  }
invalid:
- |-
  int seen_last = 0;
  for (cl = in; cl; cl = cl->next) {
    seen_last |= cl->buf->last_buf;
    if (seen_last) pass(cl);
  }
- |-
  void f(chain_t *in) {
    int done = 0;
    for (cl = in; cl; cl = cl->next) {
      done |= cl->buf->last_buf;
      if (done) pass(cl);
    }
  }
