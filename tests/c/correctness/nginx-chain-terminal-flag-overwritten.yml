id: nginx-chain-terminal-flag-overwritten
valid:
- |-
  int seen_last = 0;
  for (cl = in; cl; cl = cl->next) {
    seen_last |= cl->buf->last_buf;
  }
  if (seen_last) flush();
- |-
  void f(chain_t *in) {
    int seen_last = 0;
    for (cl = in; cl; cl = cl->next) {
      seen_last = cl->buf->flush;
    }
  }
- |-
  void f(void) {
    const char *text = "seen_last = cl->buf->last_buf";
    /* seen_last = cl->buf->last_buf; */
  }
invalid:
- |-
  int seen_last = 0;
  for (cl = in; cl; cl = cl->next) {
    seen_last = cl->buf->last_buf;
  }
  if (seen_last) flush();
- |-
  void f(chain_t *in) {
    int done = 0;
    for (cl = in; cl; cl = cl->next) {
      done = cl->buf->last_buf;
    }
  }
