      { ngx_string("x"), NGX_HTTP_LOC_CONF|NGX_CONF_FLAG, ngx_conf_set_flag_slot,
        NGX_HTTP_LOC_CONF_OFFSET, offsetof(ngx_http_x_loc_conf_t, enable), NULL },
