id: nginx-chain-terminal-flag-overwritten
snapshots:
  ? |-
    int seen_last = 0;
    for (cl = in; cl; cl = cl->next) {
      seen_last = cl->buf->last_buf;
    }
    if (seen_last) flush();
  : labels:
    - source: |-
        for (cl = in; cl; cl = cl->next) {
          seen_last = cl->buf->last_buf;
        }
      style: primary
      start: 19
      end: 88
    - source: seen_last = cl->buf->last_buf
      style: secondary
      start: 56
      end: 85
  ? |-
    void f(chain_t *in) {
      int done = 0;
      for (cl = in; cl; cl = cl->next) {
        done = cl->buf->last_buf;
      }
    }
  : labels:
    - source: |-
        for (cl = in; cl; cl = cl->next) {
            done = cl->buf->last_buf;
          }
      style: primary
      start: 40
      end: 108
    - source: done = cl->buf->last_buf
      style: secondary
      start: 79
      end: 103
