id: php-echo-superglobal-xss
valid:
- '<?php echo htmlspecialchars($_GET["q"], ENT_QUOTES, "UTF-8");'
- '<?php echo intval($_GET["id"]);'
- '<?php echo urlencode($_GET["next"]);'
- '<?php echo $safe;'
- '<?php echo "static text";'
- '<?php $x = $_GET["q"];'
- '<?php // echo $_GET["q"];'
invalid:
- '<?php echo $_GET["q"];'
- '<?php echo $_POST["name"];'
- '<?php print $_REQUEST["msg"];'
- '<?php echo "Hello " . $_GET["name"];'
- '<?php echo "<p>{$_COOKIE["last"]}</p>";'
