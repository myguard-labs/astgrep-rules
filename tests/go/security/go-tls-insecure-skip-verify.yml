id: go-tls-insecure-skip-verify
valid:
- 'package m; func f() { c := &tls.Config{MinVersion: tls.VersionTLS13} }'
- 'package m; func f() { c := &tls.Config{InsecureSkipVerify: false} }'
- 'package m; func f() { c := &tls.Config{InsecureSkipVerify: allowInsecure} }'
- 'package m; func f() { c := &tls.Config{RootCAs: pool} }'
- 'package m; // c := &tls.Config{InsecureSkipVerify: true}'
- 'package m; func f() { s := "tls.Config{InsecureSkipVerify: true}" }'
invalid:
- 'package m; func f() { c := &tls.Config{InsecureSkipVerify: true} }'
- 'package m; func f() { c := &tls.Config{MinVersion: tls.VersionTLS12, InsecureSkipVerify: true} }'
- 'package m; func f() { t := &http.Transport{TLSClientConfig: &tls.Config{InsecureSkipVerify: true}} }'
